name: CI Pipeline
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  ci:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and Test Backend
        run: |
          cd backend
          npm install
          npm run build
          npm test
      - name: Build Dashboard
        run: |
          cd dashboard
          npm install
          npm run build
